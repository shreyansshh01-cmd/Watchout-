name: Daily Stock Watch

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 UTC) every weekday. Edit the time here if you want.
    - cron: "30 4 * * 1-5"
  workflow_dispatch: {}   # lets you also click "Run" manually on GitHub anytime

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run stock watch
        env:
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python daily_watch_alert.py
